<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Git 三棵树与常用命令</title>
  <desc id="desc">展示 HEAD、暂存区和工作区之间由 add、commit、restore、reset 和 checkout 产生的数据移动。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfdf5"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#334155"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#059669"/></marker>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="64" y="62" font-family="Inter, Noto Sans SC, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Git 三棵树：命令本质是移动快照或引用</text>
  <text x="64" y="94" font-family="Inter, Noto Sans SC, sans-serif" font-size="18" fill="#64748b">比较 HEAD ↔ index 得到“待提交”；比较 index ↔ working tree 得到“未暂存”</text>

  <rect x="64" y="150" width="292" height="330" rx="22" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <rect x="64" y="150" width="292" height="68" rx="22" fill="#334155"/>
  <path d="M64 195V218H356V195" fill="#334155"/>
  <text x="210" y="192" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="24" font-weight="600" fill="#fff">HEAD / Repository</text>
  <text x="94" y="262" font-family="Inter, Noto Sans SC, sans-serif" font-size="19" font-weight="700" fill="#0f172a">当前提交指向的快照</text>
  <rect x="94" y="292" width="232" height="54" rx="10" fill="#e2e8f0"/>
  <text x="210" y="326" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="17" fill="#1e293b">commit → tree → blob</text>
  <text x="94" y="386" font-family="Inter, Noto Sans SC, sans-serif" font-size="17" fill="#475569">持久历史、父提交、作者与消息</text>
  <text x="94" y="420" font-family="Inter, Noto Sans SC, sans-serif" font-size="17" fill="#475569">分支名只是可移动的 commit 引用</text>

  <rect x="454" y="150" width="292" height="330" rx="22" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <rect x="454" y="150" width="292" height="68" rx="22" fill="#d97706"/>
  <path d="M454 195V218H746V195" fill="#d97706"/>
  <text x="600" y="192" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="24" font-weight="600" fill="#fff">Index / Staging</text>
  <text x="484" y="262" font-family="Inter, Noto Sans SC, sans-serif" font-size="19" font-weight="700" fill="#0f172a">下一次提交的精确快照</text>
  <rect x="484" y="292" width="232" height="54" rx="10" fill="#fef3c7"/>
  <text x="600" y="326" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="17" fill="#78350f">path → blob + mode + stage</text>
  <text x="484" y="386" font-family="Inter, Noto Sans SC, sans-serif" font-size="17" fill="#475569">不是“文件夹”，而是路径到对象的索引</text>
  <text x="484" y="420" font-family="Inter, Noto Sans SC, sans-serif" font-size="17" fill="#475569">可只暂存一个文件中的部分改动</text>

  <rect x="844" y="150" width="292" height="330" rx="22" fill="#fff" stroke="#34d399" stroke-width="2"/>
  <rect x="844" y="150" width="292" height="68" rx="22" fill="#059669"/>
  <path d="M844 195V218H1136V195" fill="#059669"/>
  <text x="990" y="192" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="24" font-weight="600" fill="#fff">Working Tree</text>
  <text x="874" y="262" font-family="Inter, Noto Sans SC, sans-serif" font-size="19" font-weight="700" fill="#0f172a">磁盘上正在编辑的文件</text>
  <rect x="874" y="292" width="232" height="54" rx="10" fill="#d1fae5"/>
  <text x="990" y="326" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="17" fill="#064e3b">source files + untracked</text>
  <text x="874" y="386" font-family="Inter, Noto Sans SC, sans-serif" font-size="17" fill="#475569">IDE、格式化器和构建工具实际读写处</text>
  <text x="874" y="420" font-family="Inter, Noto Sans SC, sans-serif" font-size="17" fill="#475569">未跟踪文件尚未进入 index</text>

  <path d="M844 264H758" stroke="#059669" stroke-width="3" marker-end="url(#green)"/>
  <text x="801" y="247" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="17" font-weight="600" fill="#047857">git add</text>
  <path d="M454 364H368" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="411" y="347" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="17" font-weight="600" fill="#334155">commit</text>
  <path d="M746 406H832" stroke="#d97706" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="789" y="389" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="15" fill="#92400e">git restore</text>
  <path d="M356 306C394 306 416 306 442 306" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <text x="399" y="289" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" fill="#475569">restore --staged / reset</text>

  <rect x="64" y="536" width="1072" height="128" rx="20" fill="#0f172a"/>
  <text x="94" y="576" font-family="Inter, Noto Sans SC, sans-serif" font-size="21" font-weight="700" fill="#fff">reset 的三个层级（从左向右逐步覆盖更多状态）</text>
  <text x="94" y="615" font-family="IBM Plex Mono, monospace" font-size="18" fill="#93c5fd">--soft：只移动 HEAD　　--mixed：HEAD + index　　--hard：HEAD + index + working tree</text>
  <text x="94" y="645" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" fill="#fbbf24">执行 destructive 命令前先看 git status / diff；共享历史优先 revert，以新提交抵消旧提交。</text>
</svg>
