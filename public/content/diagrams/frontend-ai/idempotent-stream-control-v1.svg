<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 生成任务的幂等、续传、背压与并发控制</title>
  <desc id="desc">展示客户端用幂等键只创建一个任务，服务端按事件序号记录和续传，通过有界队列施加背压，并以用户和模型并发门禁保护系统容量。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf4fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#23486b" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#3b78ad"/>
    </marker>
    <style>
      text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#17324a}.title{font-size:34px;font-weight:800}.sub{font-size:17px;fill:#60758a}.step{font-size:20px;font-weight:800}.detail{font-size:14px;fill:#566e82}.mono{font-family:"IBM Plex Mono","Consolas",monospace;font-size:14px}.badge{font-size:13px;font-weight:800;letter-spacing:.5px}
    </style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="58" y="62" class="title">稳定的流式任务，需要四道不同的门</text>
  <text x="58" y="96" class="sub">防重复、不断点、不过载、不挤兑分别处理；一个 loading 状态无法替代服务端约束。</text>

  <g filter="url(#shadow)">
    <rect x="58" y="148" width="248" height="320" rx="22" fill="#ffffff" stroke="#a9c5df"/>
    <circle cx="94" cy="184" r="18" fill="#e4f0ff"/><text x="94" y="190" text-anchor="middle" class="badge" fill="#25699f">1</text>
    <text x="124" y="191" class="step">幂等创建</text>
    <text x="82" y="236" class="mono">POST /tasks</text>
    <text x="82" y="264" class="mono">Idempotency-Key: k7</text>
    <rect x="82" y="292" width="200" height="68" rx="13" fill="#eff6ff" stroke="#a9c8e5"/>
    <text x="98" y="320" class="detail">第一次：创建 task-42</text>
    <text x="98" y="344" class="detail">重复提交：仍返回 task-42</text>
    <text x="82" y="402" class="detail">保护对象：业务任务与模型费用</text>
    <text x="82" y="430" class="detail">同 key 不得产生第二次副作用</text>
  </g>

  <path d="M306 308H348" stroke="#3b78ad" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="356" y="148" width="232" height="320" rx="22" fill="#ffffff" stroke="#9bc9b7"/>
    <circle cx="392" cy="184" r="18" fill="#e4f7ef"/><text x="392" y="190" text-anchor="middle" class="badge" fill="#247557">2</text>
    <text x="422" y="191" class="step">事件续传</text>
    <text x="380" y="236" class="mono">task-42 / seq</text>
    <rect x="380" y="274" width="42" height="52" rx="10" fill="#dff5ec"/><text x="401" y="306" text-anchor="middle" class="mono">53</text>
    <rect x="430" y="274" width="42" height="52" rx="10" fill="#dff5ec"/><text x="451" y="306" text-anchor="middle" class="mono">54</text>
    <rect x="480" y="274" width="42" height="52" rx="10" fill="#dff5ec"/><text x="501" y="306" text-anchor="middle" class="mono">55</text>
    <rect x="530" y="274" width="34" height="52" rx="10" fill="#edf3f7"/><text x="547" y="306" text-anchor="middle" class="mono">…</text>
    <text x="380" y="366" class="detail">重连：afterSeq=52</text>
    <text x="380" y="394" class="detail">重复序号丢弃，缺口回放</text>
    <text x="380" y="430" class="detail">保护对象：展示完整性与顺序</text>
  </g>

  <path d="M588 308H630" stroke="#3b78ad" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="638" y="148" width="232" height="320" rx="22" fill="#ffffff" stroke="#e2be75"/>
    <circle cx="674" cy="184" r="18" fill="#fff1d6"/><text x="674" y="190" text-anchor="middle" class="badge" fill="#96610c">3</text>
    <text x="704" y="191" class="step">有界背压</text>
    <text x="662" y="236" class="mono">queue ≤ highWaterMark</text>
    <rect x="662" y="274" width="184" height="60" rx="13" fill="#fff7e8" stroke="#efc87d"/>
    <rect x="676" y="288" width="32" height="32" rx="7" fill="#f7d78f"/>
    <rect x="716" y="288" width="32" height="32" rx="7" fill="#f3c86a"/>
    <rect x="756" y="288" width="32" height="32" rx="7" fill="#efb83d"/>
    <rect x="796" y="288" width="36" height="32" rx="7" fill="#e99a28"/>
    <text x="662" y="372" class="detail">高水位：暂停、合并或取消</text>
    <text x="662" y="400" class="detail">禁止无界缓存 token</text>
    <text x="662" y="430" class="detail">保护对象：内存与慢消费者</text>
  </g>

  <path d="M870 308H912" stroke="#3b78ad" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="920" y="148" width="222" height="320" rx="22" fill="#ffffff" stroke="#b5afe0"/>
    <circle cx="956" cy="184" r="18" fill="#eeebff"/><text x="956" y="190" text-anchor="middle" class="badge" fill="#6251a7">4</text>
    <text x="986" y="191" class="step">并发门禁</text>
    <text x="944" y="236" class="mono">user ≤ 2 runs</text>
    <text x="944" y="264" class="mono">model ≤ capacity</text>
    <rect x="944" y="294" width="174" height="66" rx="13" fill="#f2f0ff" stroke="#beb7e8"/>
    <text x="1031" y="322" text-anchor="middle" class="detail">第三条请求</text>
    <text x="1031" y="346" text-anchor="middle" class="detail">排队 / 拒绝 / 取消旧任务</text>
    <text x="944" y="402" class="detail">遵守 Retry-After 与总期限</text>
    <text x="944" y="430" class="detail">保护对象：租户公平与供应商额度</text>
  </g>

  <rect x="58" y="528" width="1084" height="136" rx="22" fill="#12324c"/>
  <text x="84" y="566" class="step" style="fill:#ffffff">断线后的正确判断顺序</text>
  <text x="84" y="602" class="mono" style="fill:#a9d6ff">① 查询 task-42 状态</text>
  <text x="326" y="602" class="mono" style="fill:#a9e4cf">② 继续 afterSeq=52</text>
  <text x="568" y="602" class="mono" style="fill:#ffd891">③ 只补缺失事件</text>
  <text x="798" y="602" class="mono" style="fill:#d5cfff">④ 确认任务不存在才重建</text>
  <text x="84" y="638" class="detail" style="fill:#c8d9e5">重连数据流不会自动重跑模型；重跑模型也不能替代事件续传。每一层都要有独立、可测试的身份与状态。</text>
</svg>
