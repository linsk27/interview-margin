<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">生产级 Agent 执行循环与服务端护栏</title>
  <desc id="desc">展示模型提出工具调用后，应用执行权限校验、参数校验、人工确认、幂等执行、观察与停止判断；护栏由应用强制实施而不是交给模型自律。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbf9"/><stop offset="1" stop-color="#eef4fb"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#3f7184"/></marker>
    <style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#153344}.title{font-size:34px;font-weight:800}.sub{font-size:17px;fill:#617889}.step{font-size:19px;font-weight:750}.detail{font-size:14px;fill:#5d7485}.guard{font-size:15px;font-weight:750}.mono{font-family:"IBM Plex Mono",monospace;font-size:14px}</style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="58" y="62" class="title">模型提出意图，应用拥有执行权</text>
  <text x="58" y="96" class="sub">生产级 Agent 的关键是把非确定推理包在确定性的权限、状态、预算与恢复协议里。</text>

  <rect x="58" y="142" width="1084" height="352" rx="24" fill="#fff" stroke="#c5d8de"/>
  <rect x="88" y="184" width="170" height="82" rx="17" fill="#eef8f4" stroke="#72ad92"/><text x="112" y="218" class="step">目标与状态</text><text x="112" y="244" class="detail">任务 · memory · checkpoint</text>
  <path d="M258 225H310" stroke="#3f7184" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="318" y="184" width="170" height="82" rx="17" fill="#eaf4ff" stroke="#78a8d1"/><text x="342" y="218" class="step">模型规划</text><text x="342" y="244" class="detail">回答或工具调用意图</text>
  <path d="M488 225H540" stroke="#3f7184" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="548" y="174" width="218" height="102" rx="17" fill="#fff8e8" stroke="#d9a953"/><text x="572" y="208" class="step">策略与 Schema</text><text x="572" y="234" class="detail">Allowlist · 参数 · 租户</text><text x="572" y="256" class="detail">高风险动作人工确认</text>
  <path d="M766 225H818" stroke="#3f7184" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="826" y="174" width="228" height="102" rx="17" fill="#f2f6f9" stroke="#9aaebc"/><text x="850" y="208" class="step">幂等工具执行</text><text x="850" y="234" class="detail">timeout · retry · circuit</text><text x="850" y="256" class="detail">副作用由服务端记录</text>

  <path d="M940 276V338" stroke="#3f7184" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="826" y="346" width="228" height="82" rx="17" fill="#eef8f4" stroke="#72ad92"/><text x="850" y="379" class="step">结构化 Observation</text><text x="850" y="405" class="detail">结果 · 错误类型 · 可重试性</text>
  <path d="M826 387H716" stroke="#3f7184" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="548" y="346" width="160" height="82" rx="17" fill="#eaf4ff" stroke="#78a8d1"/><text x="572" y="379" class="step">停止判断</text><text x="572" y="405" class="detail">完成 / 继续 / 失败</text>
  <path d="M548 387H454V302H403V276" fill="none" stroke="#3f7184" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="420" y="324" class="detail">继续循环</text>
  <path d="M628 428V460H348" fill="none" stroke="#2e8763" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="120" y="438" width="228" height="42" rx="14" fill="#e7f6ef" stroke="#72ad92"/><text x="234" y="465" text-anchor="middle" class="guard" fill="#266d51">最终回答 / 可恢复失败</text>

  <rect x="58" y="530" width="1084" height="150" rx="22" fill="#153344"/>
  <text x="84" y="565" class="guard" style="fill:#fff">每次循环强制执行的护栏</text>
  <rect x="84" y="586" width="184" height="58" rx="14" fill="#24495d"/><text x="176" y="611" text-anchor="middle" class="mono" style="fill:#a9dbca">maxSteps</text><text x="176" y="632" text-anchor="middle" class="detail" style="fill:#d3e5eb">防死循环</text>
  <rect x="286" y="586" width="184" height="58" rx="14" fill="#24495d"/><text x="378" y="611" text-anchor="middle" class="mono" style="fill:#a9d1f2">deadline</text><text x="378" y="632" text-anchor="middle" class="detail" style="fill:#d3e5eb">端到端超时</text>
  <rect x="488" y="586" width="184" height="58" rx="14" fill="#24495d"/><text x="580" y="611" text-anchor="middle" class="mono" style="fill:#ffdc9c">token/cost</text><text x="580" y="632" text-anchor="middle" class="detail" style="fill:#d3e5eb">预算上限</text>
  <rect x="690" y="586" width="184" height="58" rx="14" fill="#24495d"/><text x="782" y="611" text-anchor="middle" class="mono" style="fill:#ffb9b5">approval</text><text x="782" y="632" text-anchor="middle" class="detail" style="fill:#d3e5eb">高风险确认</text>
  <rect x="892" y="586" width="224" height="58" rx="14" fill="#24495d"/><text x="1004" y="611" text-anchor="middle" class="mono" style="fill:#c8c4ff">trace + checkpoint</text><text x="1004" y="632" text-anchor="middle" class="detail" style="fill:#d3e5eb">审计与断点恢复</text>
</svg>
