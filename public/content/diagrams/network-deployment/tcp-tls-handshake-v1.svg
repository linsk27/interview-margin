<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">TCP 与 TLS 1.3 握手时序</title>
  <desc id="desc">展示客户端和服务端先完成 TCP 三次握手，再进行 TLS 1.3 密钥协商与证书验证，最后传输加密 HTTP 数据。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eff6ff"/></linearGradient>
    <marker id="right" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="left" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 0 5 10 10Z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="64" y="62" font-family="Inter, Noto Sans SC, sans-serif" font-size="34" font-weight="700" fill="#0f172a">HTTPS 建连：TCP 可靠通道 + TLS 1.3 安全通道</text>
  <text x="64" y="94" font-family="Inter, Noto Sans SC, sans-serif" font-size="18" fill="#64748b">下图是不含会话恢复的典型完整握手；TLS 记录承载在已建立的 TCP 字节流中</text>

  <rect x="98" y="128" width="250" height="66" rx="18" fill="#2563eb"/>
  <text x="223" y="170" text-anchor="middle" font-family="Inter, Noto Sans SC, sans-serif" font-size="23" font-weight="700" fill="#fff">客户端 Browser</text>
  <rect x="852" y="128" width="250" height="66" rx="18" fill="#7c3aed"/>
  <text x="977" y="170" text-anchor="middle" font-family="Inter, Noto Sans SC, sans-serif" font-size="23" font-weight="700" fill="#fff">服务端 Origin</text>
  <line x1="223" y1="194" x2="223" y2="662" stroke="#93c5fd" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="977" y1="194" x2="977" y2="662" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="7 7"/>

  <rect x="64" y="218" width="1072" height="150" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="84" y="246" font-family="Inter, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#1e40af">TCP 三次握手：确认双方收发能力并同步初始序列号</text>
  <line x1="236" y1="272" x2="964" y2="272" stroke="#2563eb" stroke-width="3" marker-end="url(#right)"/>
  <text x="600" y="264" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="17" fill="#1e3a8a">1　SYN, seq = x</text>
  <line x1="964" y1="312" x2="236" y2="312" stroke="#7c3aed" stroke-width="3" marker-end="url(#left)"/>
  <text x="600" y="304" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="17" fill="#4c1d95">2　SYN + ACK, seq = y, ack = x + 1</text>
  <line x1="236" y1="350" x2="964" y2="350" stroke="#2563eb" stroke-width="3" marker-end="url(#right)"/>
  <text x="600" y="342" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="17" fill="#1e3a8a">3　ACK, ack = y + 1</text>

  <rect x="64" y="390" width="1072" height="204" rx="18" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="84" y="420" font-family="Inter, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#5b21b6">TLS 1.3：协商参数、认证服务器、导出对称会话密钥</text>
  <line x1="236" y1="450" x2="964" y2="450" stroke="#2563eb" stroke-width="3" marker-end="url(#right)"/>
  <text x="600" y="442" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="16" fill="#1e3a8a">4　ClientHello: versions, cipher suites, key_share, SNI</text>
  <line x1="964" y1="496" x2="236" y2="496" stroke="#7c3aed" stroke-width="3" marker-end="url(#left)"/>
  <text x="600" y="488" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="16" fill="#4c1d95">5　ServerHello + EncryptedExtensions + Certificate + Verify + Finished</text>
  <line x1="236" y1="542" x2="964" y2="542" stroke="#2563eb" stroke-width="3" marker-end="url(#right)"/>
  <text x="600" y="534" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="16" fill="#1e3a8a">6　验证域名/证书链/签名 → Finished</text>
  <text x="600" y="578" text-anchor="middle" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" fill="#6d28d9">双方基于 (EC)DHE 共享秘密和 transcript 派生独立的读写密钥</text>

  <line x1="236" y1="630" x2="964" y2="630" stroke="#059669" stroke-width="4" marker-end="url(#right)"/>
  <text x="600" y="620" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="17" font-weight="600" fill="#047857">7　Encrypted Application Data: HTTP request / response</text>
  <text x="64" y="684" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" fill="#64748b">TLS 保证传输机密性、完整性和对端认证；它不自动保证登录账号可信、业务授权正确或服务端本身无漏洞。</text>
</svg>
