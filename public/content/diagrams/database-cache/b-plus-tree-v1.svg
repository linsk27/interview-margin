<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">B+Tree 索引查找与范围扫描</title>
  <desc id="desc">展示根节点、内部节点和叶子节点的有序分隔键，等值查找沿树下降，范围查询再沿叶子链顺序扫描。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#fffbeb"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#475569"/></marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#d97706"/></marker>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="64" y="62" font-family="Inter, Noto Sans SC, sans-serif" font-size="34" font-weight="700" fill="#0f172a">B+Tree：内部节点导航，叶子节点保存有序数据</text>
  <text x="64" y="94" font-family="Inter, Noto Sans SC, sans-serif" font-size="18" fill="#64748b">高扇出让树高稳定；叶子相邻链接让范围扫描不必反复回到根节点</text>

  <text x="76" y="153" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#64748b">ROOT</text>
  <rect x="512" y="124" width="176" height="76" rx="16" fill="#0f172a"/>
  <line x1="600" y1="124" x2="600" y2="200" stroke="#475569"/>
  <text x="556" y="172" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="23" fill="#fff">30</text>
  <text x="644" y="172" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="23" fill="#fff">60</text>

  <text x="76" y="230" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#64748b">INTERNAL</text>
  <rect x="116" y="244" width="250" height="76" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <line x1="199" y1="244" x2="199" y2="320" stroke="#93c5fd"/><line x1="282" y1="244" x2="282" y2="320" stroke="#93c5fd"/>
  <text x="158" y="291" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="21" fill="#1e3a8a">10</text><text x="241" y="291" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="21" fill="#1e3a8a">20</text><text x="324" y="291" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="21" fill="#1e3a8a">28</text>
  <rect x="475" y="244" width="250" height="76" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <line x1="558" y1="244" x2="558" y2="320" stroke="#fbbf24"/><line x1="641" y1="244" x2="641" y2="320" stroke="#fbbf24"/>
  <text x="517" y="291" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="21" fill="#78350f">35</text><text x="600" y="291" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="21" fill="#78350f">45</text><text x="683" y="291" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="21" fill="#78350f">55</text>
  <rect x="834" y="244" width="250" height="76" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <line x1="917" y1="244" x2="917" y2="320" stroke="#93c5fd"/><line x1="1000" y1="244" x2="1000" y2="320" stroke="#93c5fd"/>
  <text x="876" y="291" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="21" fill="#1e3a8a">65</text><text x="959" y="291" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="21" fill="#1e3a8a">75</text><text x="1042" y="291" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="21" fill="#1e3a8a">88</text>

  <path d="M556 200L241 234" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M600 200V232" stroke="#d97706" stroke-width="4" marker-end="url(#amber)"/>
  <path d="M644 200L959 234" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="76" y="370" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#64748b">LEAVES</text>
  <rect x="64" y="386" width="245" height="92" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="186" y="424" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="18" fill="#0f172a">[10,row] [20,row]</text><text x="186" y="456" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="18" fill="#0f172a">[28,row]</text>
  <rect x="359" y="386" width="245" height="92" rx="16" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
  <text x="481" y="424" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="18" fill="#78350f">[35,row] [45,row]</text><text x="481" y="456" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="18" fill="#78350f">[55,row]</text>
  <rect x="654" y="386" width="245" height="92" rx="16" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
  <text x="776" y="424" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="18" fill="#78350f">[65,row] [75,row]</text><text x="776" y="456" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="18" fill="#78350f">[88,row]</text>
  <rect x="949" y="386" width="187" height="92" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="1042" y="424" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="18" fill="#0f172a">[90,row]</text><text x="1042" y="456" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="18" fill="#0f172a">[99,row]</text>
  <path d="M309 432H347" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M604 432H642" stroke="#d97706" stroke-width="4" marker-end="url(#amber)"/><path d="M899 432H937" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M517 320L481 374" stroke="#d97706" stroke-width="4" marker-end="url(#amber)"/>

  <rect x="64" y="536" width="1072" height="128" rx="20" fill="#0f172a"/>
  <text x="94" y="575" font-family="Inter, Noto Sans SC, sans-serif" font-size="20" font-weight="700" fill="#fff">示例：WHERE key BETWEEN 42 AND 82</text>
  <text x="94" y="610" font-family="Inter, Noto Sans SC, sans-serif" font-size="17" fill="#fde68a">根节点定位 30–60 子树 → 内部节点定位含 42 的叶子 → 在叶子内二分找到起点 → 沿叶子链读到 82 后停止</text>
  <text x="94" y="641" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" fill="#cbd5e1">InnoDB 聚簇索引叶子保存整行；二级索引叶子保存索引列与主键，非覆盖查询通常还要回表。</text>
</svg>
