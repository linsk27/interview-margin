<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">MVCC Read View 与版本链</title>
  <desc id="desc">事务 A 建立 Read View 后沿 undo 版本链选择对自己可见的记录；事务 B 更新并提交新版本，不同隔离级别下事务 A 是否重新建立 Read View 决定它能否看到新值。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef5fa"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#3c7199"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#173149" flood-opacity=".11"/></filter>
    <style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#173149}.eyebrow{font:700 15px "IBM Plex Mono",monospace;letter-spacing:2px;fill:#286ca7}.title{font-size:34px;font-weight:800}.sub{font-size:16px;fill:#5f7688}.node{font-size:20px;font-weight:800}.body{font-size:15px;fill:#566f82}.mono{font:700 14px "IBM Plex Mono",monospace}</style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="58" y="58" class="eyebrow">MVCC SNAPSHOT READ</text>
  <text x="58" y="102" class="title">一致性读不是复制整张表，而是按可见性选择版本</text>
  <text x="58" y="135" class="sub">新版本仍在主记录上，旧版本由 undo 信息串成链；Read View 决定当前事务能看到链上的哪一项。</text>

  <rect x="58" y="207" width="258" height="174" rx="24" fill="#edf5ff" stroke="#83acd0" filter="url(#shadow)"/>
  <text x="187" y="250" text-anchor="middle" class="node">事务 A：一致性读</text>
  <text x="88" y="286" class="body">• 创建或复用 Read View</text>
  <text x="88" y="318" class="body">• 检查记录 trx_id 是否可见</text>
  <text x="88" y="350" class="body">• 不可见就沿版本链向后找</text>

  <rect x="58" y="439" width="258" height="138" rx="24" fill="#fff7e8" stroke="#d6aa65" filter="url(#shadow)"/>
  <text x="187" y="482" text-anchor="middle" class="node">事务 B：更新并提交</text>
  <text x="88" y="518" class="body">balance: 100 → 80</text>
  <text x="88" y="548" class="body">新记录写入自己的 trx_id</text>

  <rect x="420" y="204" width="294" height="170" rx="24" fill="#fff" stroke="#9db9cd" filter="url(#shadow)"/>
  <text x="567" y="246" text-anchor="middle" class="node">Read View</text>
  <text x="454" y="282" class="mono">creator_trx_id = A</text>
  <text x="454" y="312" class="mono">active_ids = [B, …]</text>
  <text x="454" y="342" class="body">回答：哪些事务版本对 A 可见？</text>

  <rect x="820" y="181" width="320" height="132" rx="22" fill="#eaf7f1" stroke="#78aa91" filter="url(#shadow)"/>
  <text x="980" y="222" text-anchor="middle" class="node">当前记录</text>
  <text x="850" y="258" class="mono">balance=80 · trx_id=B</text>
  <text x="850" y="286" class="body">对旧 Read View 可能不可见</text>

  <rect x="820" y="355" width="320" height="132" rx="22" fill="#fff" stroke="#9db9cd" filter="url(#shadow)"/>
  <text x="980" y="396" text-anchor="middle" class="node">undo 中的旧版本</text>
  <text x="850" y="432" class="mono">balance=100 · trx_id=older</text>
  <text x="850" y="460" class="body">沿 roll_pointer 找到可见版本</text>

  <path d="M316 284H410" stroke="#3c7199" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M714 272C760 254 774 246 810 246" fill="none" stroke="#3c7199" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M980 313V345" stroke="#3c7199" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M316 508C466 515 642 517 810 445" fill="none" stroke="#3c7199" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="386" y="536" width="754" height="128" rx="22" fill="#173149"/>
  <text x="416" y="575" style="font-size:17px;font-weight:800;fill:#fff">隔离级别决定 Read View 何时更新</text>
  <text x="416" y="607" style="font-size:15px;fill:#d8e6ef">READ COMMITTED：每次一致性读通常新建视图，所以后一次可能看到 B 已提交的 80</text>
  <text x="416" y="636" style="font-size:15px;fill:#d8e6ef">REPEATABLE READ：事务内通常复用视图，所以后一次仍可能看到旧版本 100</text>
  <text x="416" y="660" style="font-size:13px;fill:#9fc4de">当前读、加锁读和写操作仍要结合锁分析，不能把所有查询都解释成快照读</text>
</svg>
