<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">JavaScript 宽松相等比较的类型转换</title>
  <desc id="desc">逐步展示空数组与 false 宽松相等时，false 转为数字、空数组转为空字符串后再转为数字的过程，并区分条件判断的 ToBoolean。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#475569"/></marker>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="64" y="62" font-family="Inter, Noto Sans SC, sans-serif" font-size="34" font-weight="700" fill="#0f172a">[] == false 为什么是 true？</text>
  <text x="64" y="96" font-family="Inter, Noto Sans SC, sans-serif" font-size="18" fill="#64748b">跟着宽松相等规则逐步转换，不要把它与 if 的真假判断混在一起</text>

  <rect x="64" y="134" width="300" height="112" rx="18" fill="#0f172a"/>
  <text x="92" y="170" font-family="Inter, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#93c5fd">① 先看两侧类型</text>
  <text x="214" y="211" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="25" font-weight="700" fill="#fff">[]  ==  false</text>
  <text x="214" y="234" text-anchor="middle" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" fill="#cbd5e1">Object 与 Boolean</text>

  <rect x="450" y="134" width="300" height="112" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="478" y="170" font-family="Inter, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#92400e">② 布尔值先转数字</text>
  <text x="600" y="211" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="25" font-weight="700" fill="#78350f">false  →  0</text>
  <text x="600" y="234" text-anchor="middle" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" fill="#92400e">IsLooselyEqual 的 Boolean 分支</text>

  <rect x="836" y="134" width="300" height="112" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="864" y="170" font-family="Inter, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#5b21b6">③ 对象转原始值</text>
  <text x="986" y="211" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="25" font-weight="700" fill="#4c1d95">[]  →  ''</text>
  <text x="986" y="234" text-anchor="middle" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" fill="#6d28d9">ToPrimitive：valueOf → toString</text>

  <path d="M364 190H438" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M750 190H824" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M986 246V296" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="836" y="308" width="300" height="112" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="864" y="344" font-family="Inter, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#1e40af">④ 字符串与数字比较</text>
  <text x="986" y="385" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="25" font-weight="700" fill="#172554">''  →  0</text>
  <text x="986" y="408" text-anchor="middle" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" fill="#1e40af">ToNumber('') 得到 +0</text>

  <rect x="450" y="308" width="300" height="112" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="478" y="344" font-family="Inter, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#475569">⑤ 比较两个数值</text>
  <text x="600" y="388" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="27" font-weight="700" fill="#0f172a">0  ==  0</text>

  <rect x="64" y="308" width="300" height="112" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="92" y="344" font-family="Inter, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#166534">⑥ 得到结果</text>
  <text x="214" y="390" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="32" font-weight="700" fill="#14532d">true</text>

  <path d="M836 364H762" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M450 364H376" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="64" y="474" width="1072" height="176" rx="20" fill="#0f172a"/>
  <text x="94" y="516" font-family="Inter, Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#fff">别混淆：宽松相等不是条件判断</text>
  <text x="94" y="558" font-family="IBM Plex Mono, monospace" font-size="22" fill="#93c5fd">[] == false  →  true</text>
  <text x="430" y="558" font-family="IBM Plex Mono, monospace" font-size="22" fill="#86efac">if ([])  →  true</text>
  <text x="94" y="596" font-family="Inter, Noto Sans SC, sans-serif" font-size="18" fill="#cbd5e1">前者执行宽松相等转换；后者只对数组对象执行 ToBoolean，所有对象都是真值。</text>
  <text x="94" y="630" font-family="Inter, Noto Sans SC, sans-serif" font-size="17" fill="#fbbf24">JavaScript 假值：false、undefined、null、0、-0、0n、NaN 和空字符串 ''。</text>
</svg>
