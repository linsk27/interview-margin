<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">JavaScript 原型链与属性查找</title>
  <desc id="desc">展示实例、构造函数 prototype、Object.prototype 与 null 的链路，以及属性查找和 constructor 关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fafafa"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#475569"/></marker>
    <marker id="violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="64" y="62" font-family="Inter, Noto Sans SC, sans-serif" font-size="34" font-weight="700" fill="#0f172a">原型链：属性查找沿 [[Prototype]] 单向向上</text>
  <text x="64" y="94" font-family="Inter, Noto Sans SC, sans-serif" font-size="18" fill="#64748b">prototype 是函数对象的普通属性；[[Prototype]] 是对象之间的内部链接</text>

  <rect x="64" y="150" width="250" height="290" rx="22" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <rect x="64" y="150" width="250" height="64" rx="22" fill="#2563eb"/>
  <path d="M64 192V214H314V192" fill="#2563eb"/>
  <text x="189" y="191" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="23" font-weight="600" fill="#fff">alice</text>
  <text x="90" y="257" font-family="IBM Plex Mono, monospace" font-size="18" fill="#0f172a">name: 'Alice'</text>
  <text x="90" y="298" font-family="IBM Plex Mono, monospace" font-size="18" fill="#0f172a">role: 'developer'</text>
  <line x1="90" y1="326" x2="288" y2="326" stroke="#e2e8f0"/>
  <text x="90" y="365" font-family="IBM Plex Mono, monospace" font-size="17" fill="#1d4ed8">[[Prototype]] ──────┐</text>
  <text x="90" y="406" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" fill="#64748b">new Person(...) 创建的实例</text>

  <rect x="410" y="150" width="300" height="290" rx="22" fill="#fff" stroke="#a78bfa" stroke-width="2"/>
  <rect x="410" y="150" width="300" height="64" rx="22" fill="#7c3aed"/>
  <path d="M410 192V214H710V192" fill="#7c3aed"/>
  <text x="560" y="191" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="22" font-weight="600" fill="#fff">Person.prototype</text>
  <text x="438" y="257" font-family="IBM Plex Mono, monospace" font-size="18" fill="#0f172a">greet: function</text>
  <text x="438" y="298" font-family="IBM Plex Mono, monospace" font-size="18" fill="#0f172a">constructor: Person</text>
  <line x1="438" y1="326" x2="682" y2="326" stroke="#e2e8f0"/>
  <text x="438" y="365" font-family="IBM Plex Mono, monospace" font-size="17" fill="#6d28d9">[[Prototype]] ──────┐</text>
  <text x="438" y="406" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" fill="#64748b">共享方法只存一份</text>

  <rect x="806" y="150" width="300" height="290" rx="22" fill="#fff" stroke="#34d399" stroke-width="2"/>
  <rect x="806" y="150" width="300" height="64" rx="22" fill="#059669"/>
  <path d="M806 192V214H1106V192" fill="#059669"/>
  <text x="956" y="191" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="22" font-weight="600" fill="#fff">Object.prototype</text>
  <text x="834" y="257" font-family="IBM Plex Mono, monospace" font-size="18" fill="#0f172a">toString: function</text>
  <text x="834" y="298" font-family="IBM Plex Mono, monospace" font-size="18" fill="#0f172a">hasOwnProperty: function</text>
  <line x1="834" y1="326" x2="1078" y2="326" stroke="#e2e8f0"/>
  <text x="834" y="365" font-family="IBM Plex Mono, monospace" font-size="17" fill="#047857">[[Prototype]] → null</text>
  <text x="834" y="406" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" fill="#64748b">普通对象链路终点</text>

  <path d="M314 365C360 365 360 365 398 365" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M710 365C758 365 758 365 794 365" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="356" y="349" text-anchor="middle" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" fill="#475569">找不到就继续</text>
  <text x="758" y="349" text-anchor="middle" font-family="Inter, Noto Sans SC, sans-serif" font-size="15" fill="#475569">继续向上</text>

  <rect x="64" y="500" width="710" height="150" rx="20" fill="#0f172a"/>
  <text x="94" y="540" font-family="Inter, Noto Sans SC, sans-serif" font-size="21" font-weight="700" fill="#fff">读取 alice.greet 的查找过程</text>
  <text x="94" y="579" font-family="IBM Plex Mono, monospace" font-size="19" fill="#bfdbfe">alice own keys　×　→　Person.prototype　✓</text>
  <text x="94" y="618" font-family="Inter, Noto Sans SC, sans-serif" font-size="17" fill="#cbd5e1">写入默认落到 alice 自身并遮蔽同名原型属性；delete 只删除自身属性，不会删除原型上的方法。</text>

  <rect x="822" y="500" width="284" height="150" rx="20" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text x="964" y="540" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="20" font-weight="600" fill="#5b21b6">Person.prototype</text>
  <text x="964" y="574" text-anchor="middle" font-family="Inter, Noto Sans SC, sans-serif" font-size="16" fill="#6d28d9">是 Person 函数的 prototype 属性</text>
  <text x="964" y="612" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="17" fill="#5b21b6">.constructor ─→ Person</text>
  <path d="M1106 612C1150 590 1150 526 1116 510" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#violet)"/>
</svg>
