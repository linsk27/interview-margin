# Replace the example domain and certificate paths before enabling this file.
# Generic Nginx location: /etc/nginx/sites-available/interview-margin.conf
# BaoTa/aaPanel location: /www/server/panel/vhost/nginx/<domain>.conf

server {
    listen 80;
    listen [::]:80;
    server_name interview.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name interview.example.com;

    ssl_certificate     /etc/letsencrypt/live/interview.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/interview.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:InterviewMarginTLS:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/interview-margin.access.log;
    error_log  /var/log/nginx/interview-margin.error.log warn;

    client_max_body_size 5m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
        proxy_buffering on;
        proxy_request_buffering on;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }
}
